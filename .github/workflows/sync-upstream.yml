name: Sync upstream master into the OIDC branch

# Merges the latest makeplane master into this branch (which carries our OIDC
# patches), then pushes. The branch only ever moves forward, so it never needs
# a force-push and every fix-up can land as a normal PR.
# Runs daily; can also be triggered manually from the Actions tab.
#
# If the merge conflicts (upstream changed a line our patches also touch), the
# workflow fails and notifies the Claude routine, which opens a PR with the
# conflicts resolved (MAINTENANCE.md §3.3). To resolve by hand instead:
#   git fetch upstream master && git merge upstream/master
#   # fix conflicts, git add -A && git commit
#   git push origin oidc-on-master

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  PATCH_BRANCH: oidc-on-master
  UPSTREAM_REPO: https://github.com/makeplane/plane.git
  UPSTREAM_BRANCH: master

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PATCH_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream + fetch
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Merge upstream/${{ env.UPSTREAM_BRANCH }}
        run: git merge --no-edit "upstream/${UPSTREAM_BRANCH}"

      - name: Push
        run: git push origin "$PATCH_BRANCH"

      - name: Notify Claude routine on failure (optional)
        if: failure()
        continue-on-error: true
        env:
          CLAUDE_ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$CLAUDE_ROUTINE_URL" ] || [ -z "$CLAUDE_ROUTINE_TOKEN" ]; then
            echo "Webhook not configured, skipping."
            exit 0
          fi
          TEXT="Merging upstream ${UPSTREAM_BRANCH} into ${PATCH_BRANCH} failed in ${REPO}. Run: ${RUN_URL}. Follow MAINTENANCE.md section 3.3 on ${PATCH_BRANCH}: resolve the conflicts in a merge commit and open a PR against ${PATCH_BRANCH}."
          curl -sS -X POST "$CLAUDE_ROUTINE_URL" \
            -H "Authorization: Bearer $CLAUDE_ROUTINE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg text "$TEXT" '{text:$text}')"

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository
    # activity. Re-enabling an active workflow through the API resets that timer.
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-upstream.yml/enable"
